<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliente de Administração</title>
<script src="/lib/hls.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:13.5px/1.5 system-ui,sans-serif; background:#0e1116; color:#e6edf3; }
  a { color:#58a6ff; }
  input, select, button, textarea { padding:6px 9px; border-radius:5px; border:1px solid #30363d;
                                    background:#0d1117; color:inherit; font:inherit; }
  input:disabled, select:disabled { opacity:.5 }
  button { background:#238636; border-color:#238636; cursor:pointer; font-weight:600; }
  button:hover { background:#2ea043; }
  button.ghost { background:#21262d; border-color:#30363d; font-weight:400; }
  button.ghost:hover { background:#2d333b; }
  button.danger { background:#3d1d1d; border-color:#6e2c2c; font-weight:400; }
  button.danger:hover { background:#5a2626; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:#8b949e; font-weight:600; font-size:10.5px; text-transform:uppercase;
       letter-spacing:.06em; padding:6px 8px; border-bottom:1px solid #23282f; }
  td { padding:6px 8px; border-bottom:1px solid #171c22; vertical-align:middle; }
  tr.sel td { background:#1c2431; }
  .hidden { display:none !important; }
  .err { color:#f85149; font-size:12.5px; min-height:17px; }
  .ok { color:#3fb950; } .muted { color:#8b949e; } .warn { color:#d29922; } .off { color:#f85149; }
  code { font-family:ui-monospace,monospace; font-size:12px; }

  /* ---------- login ---------- */
  #login { display:grid; place-items:center; min-height:100vh; }
  #login form { width:330px; display:grid; gap:10px; background:#161b22;
                border:1px solid #23282f; border-radius:10px; padding:26px; }

  /* ---------- estrutura ---------- */
  #shell { display:grid; grid-template-columns:250px 1fr; height:100vh; }
  nav { background:#0b0f14; border-right:1px solid #23282f; overflow-y:auto; padding-bottom:24px; }
  nav .brand { padding:14px 16px; border-bottom:1px solid #23282f; font-weight:600; font-size:13px; }
  nav .node { padding:8px 16px; color:#c9d1d9; cursor:pointer; font-size:12.5px;
              display:flex; align-items:center; gap:7px; user-select:none; }
  nav .node:hover { background:#141a21; }
  nav .node.root { font-weight:600; color:#e6edf3; margin-top:6px; }
  nav .node.leaf { padding-left:36px; border-left:2px solid transparent; }
  nav .node.leaf.active { background:#161d27; border-left-color:#238636; color:#fff; font-weight:600; }
  nav .node.leaf.soon { color:#5c6570; }
  nav .caret { width:9px; font-size:9px; color:#6e7681; }
  nav .kids.collapsed { display:none; }

  main { overflow-y:auto; padding:18px 24px 40px; }
  .topbar { display:flex; align-items:center; gap:12px; margin-bottom:16px;
            padding-bottom:12px; border-bottom:1px solid #23282f; }
  .topbar h2 { font-size:17px; margin:0; }
  .topbar .crumb { color:#6e7681; font-size:12px; }
  .topbar .fill { flex:1 }

  /* ---------- blocos ---------- */
  .panel { background:#161b22; border:1px solid #23282f; border-radius:7px; padding:15px; margin-bottom:16px; }
  .panel > h3 { font-size:11.5px; margin:0 0 12px; text-transform:uppercase;
                letter-spacing:.06em; color:#8b949e; display:flex; align-items:center; gap:8px; }
  .panel > h3 .fill { flex:1 }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:12px; }
  label.f { display:grid; gap:3px; font-size:11.5px; color:#8b949e; }
  label.f input, label.f select, label.f textarea { width:100%; }
  .inline { display:flex; gap:8px; flex-wrap:wrap; align-items:end; }
  .actions { display:flex; gap:8px; margin-top:14px; padding-top:12px; border-top:1px solid #23282f; }
  .hint { color:#6e7681; font-size:11.5px; margin:8px 0 0; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:11px; margin-bottom:16px; }
  .card { background:#161b22; border:1px solid #23282f; border-radius:7px; padding:12px 14px; }
  .card .lbl { color:#8b949e; font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; }
  .card .val { font-size:21px; font-weight:700; margin-top:3px; }
  .card .sub { color:#6e7681; font-size:11.5px; }
  .bar { height:5px; background:#21262d; border-radius:3px; overflow:hidden; margin-top:7px; }
  .bar > i { display:block; height:100% }

  /* ---------- abas ---------- */
  .tabs { display:flex; gap:2px; border-bottom:1px solid #23282f; margin-bottom:14px; flex-wrap:wrap; }
  .tabs button { background:none; border:none; border-bottom:2px solid transparent; border-radius:0;
                 color:#8b949e; font-weight:500; padding:7px 13px; font-size:12.5px; }
  .tabs button:hover { color:#e6edf3; background:#161b22; }
  .tabs button.active { color:#fff; border-bottom-color:#238636; font-weight:600; }

  /* ---------- janela modal ---------- */
  .overlay { position:fixed; inset:0; background:#000a; display:grid; place-items:center; z-index:50; }
  .window { background:#161b22; border:1px solid #30363d; border-radius:9px; width:min(880px,94vw);
            max-height:88vh; display:flex; flex-direction:column; box-shadow:0 12px 40px #000a; }
  .window .wtitle { padding:12px 16px; border-bottom:1px solid #23282f; display:flex;
                    align-items:center; gap:10px; font-weight:600; font-size:14px; }
  .window .wbody { padding:16px; overflow-y:auto; }
  .window .wfoot { padding:11px 16px; border-top:1px solid #23282f; display:flex; gap:8px; justify-content:flex-end; }
  .x { margin-left:auto; background:none; border:none; color:#8b949e; font-size:19px; padding:0 4px; }
  .x:hover { color:#f85149; background:none; }

  .soonbox { background:#161b22; border:1px dashed #30363d; border-radius:7px; padding:26px; text-align:center; }
  pre { background:#0d1117; border:1px solid #23282f; border-radius:6px; padding:10px;
        overflow:auto; font-size:11.5px; max-height:320px; }

  /* ---------- UX simplificada ---------- */
  .banner-warn { background:#3d2e00; border:1px solid #9e6a03; color:#e3b341; border-radius:7px;
                 padding:10px 12px; margin-bottom:14px; font-size:12.5px; line-height:1.45; }
  .banner-info { background:#12233a; border:1px solid #1f4b7a; color:#79c0ff; border-radius:7px;
                 padding:10px 12px; margin-bottom:14px; font-size:12.5px; line-height:1.45; }
  .banner-ok { background:#0f2a1a; border:1px solid #238636; color:#3fb950; border-radius:7px;
               padding:10px 12px; margin-bottom:14px; font-size:12.5px; }
  .quick-bar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .quick-bar button { font-size:12.5px; }
  .empty-hero { text-align:center; padding:36px 20px; background:#161b22; border:1px dashed #30363d;
                border-radius:10px; margin-bottom:16px; }
  .empty-hero h3 { margin:0 0 8px; font-size:16px; text-transform:none; letter-spacing:0; color:#e6edf3; }
  .empty-hero p { color:#8b949e; margin:0 0 16px; }
  .empty-hero .actions { justify-content:center; border:none; padding:0; margin:0; }
  .nav-tools { padding:8px 12px 4px; border-bottom:1px solid #23282f; display:grid; gap:6px; }
  .nav-tools input { width:100%; font-size:12px; }
  .nav-tools label.adv { display:flex; align-items:center; gap:6px; color:#8b949e; font-size:11px;
                         cursor:pointer; user-select:none; }
  .nav-tools label.adv input { width:auto; }
  .steps { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .steps .step { padding:6px 12px; border-radius:999px; border:1px solid #30363d; color:#8b949e;
                 font-size:12px; background:#0d1117; }
  .steps .step.on { border-color:#238636; color:#fff; background:#1a3d28; font-weight:600; }
  .steps .step.done { border-color:#23863655; color:#3fb950; }
  details.adv-box { border:1px solid #23282f; border-radius:7px; padding:10px 12px; margin-top:10px; background:#12171e; }
  details.adv-box > summary { cursor:pointer; color:#8b949e; font-size:12px; font-weight:600; }
  details.adv-box[open] > summary { margin-bottom:10px; color:#c9d1d9; }
  .subtabs { display:flex; gap:4px; margin-bottom:12px; flex-wrap:wrap; }
  .subtabs button { background:#21262d; border:1px solid #30363d; font-weight:500; font-size:12px; }
  .subtabs button.active { background:#238636; border-color:#238636; color:#fff; font-weight:600; }
  .toast { position:fixed; right:18px; bottom:18px; z-index:80; background:#1f6feb; color:#fff;
           padding:10px 14px; border-radius:8px; font-size:13px; box-shadow:0 8px 24px #0008;
           display:none; max-width:360px; }
  .toast.show { display:block; animation:toastIn .15s ease; }
  @keyframes toastIn { from { transform:translateY(8px); opacity:0 } to { transform:none; opacity:1 } }

  /* ---------- preview da câmera ---------- */
  .cam-preview { display:grid; grid-template-columns:minmax(280px,1.2fr) minmax(180px,.8fr); gap:14px; margin-top:12px;
                 align-items:start; }
  .cam-preview-box { position:relative; background:#0a0e14; border:1px solid #30363d; border-radius:8px;
                     aspect-ratio:16/10; overflow:hidden; min-height:180px; }
  .cam-preview-box video, .cam-preview-box img { position:absolute; inset:0; width:100%; height:100%;
                     object-fit:contain; background:#000; z-index:1; }
  .cam-preview-box .pv-status { position:absolute; left:8px; bottom:8px; right:8px; font-size:11px; color:#c9d1d9;
                                background:#000a; border-radius:4px; padding:4px 8px; z-index:2; pointer-events:none; }
  /* Com imagem ok, some o overlay para não cobrir o snapshot */
  .cam-preview-box.has-img .pv-status:not(.err):not(.loading) { opacity:0; transition:opacity .35s ease .6s; }
  .cam-preview-box .pv-status.err { color:#f85149; opacity:1; }
  .cam-preview-box .pv-status.ok { color:#3fb950; }
  .cam-preview-box .pv-status.loading { color:#c9d1d9; opacity:1; }
  .cam-preview-actions { display:flex; flex-direction:column; gap:8px; }
  .cam-preview-actions button { width:100%; }
  @media (max-width:640px) { .cam-preview { grid-template-columns:1fr; } }
</style>
</head>
<body>

<section id="login">
  <!-- method="post" é defesa em profundidade: se o JS falhar, o submit nativo
       não pode vazar a senha na querystring, no histórico e no referrer. -->
  <form id="loginForm" method="post" action="about:blank">
    <h1 style="font-size:15px;margin:0">Cliente de Administração</h1>
    <p class="muted" style="margin:-4px 0 6px;font-size:12.5px">Acesso restrito a administradores</p>
    <input name="username" placeholder="Usuário" autocomplete="username" required autofocus>
    <input name="password" type="password" placeholder="Senha" autocomplete="current-password" required>
    <input name="totpCode" id="totp" class="hidden" placeholder="Código 2FA" inputmode="numeric">
    <button type="submit">Conectar</button>
    <div class="err" id="loginErr"></div>
  </form>
</section>

<!-- Troca obrigatória resolvida aqui mesmo: mandar o administrador para outro
     painel só para trocar a senha era um beco sem saída. -->
<section id="troca" class="hidden" style="display:grid;place-items:center;min-height:100vh">
  <form id="trocaForm" method="post" action="about:blank"
        style="width:340px;display:grid;gap:10px;background:#161b22;border:1px solid #23282f;
               border-radius:10px;padding:26px">
    <h1 style="font-size:15px;margin:0">Defina uma nova senha</h1>
    <p class="muted" style="margin:-4px 0 4px;font-size:12.5px">Obrigatório no primeiro acesso.</p>
    <input name="currentPassword" type="password" placeholder="Senha atual" required>
    <input name="newPassword" type="password" placeholder="Nova senha" autocomplete="new-password" required>
    <ul id="regras" style="margin:0;padding-left:18px;color:#8b949e;font-size:11.5px;line-height:1.7"></ul>
    <button type="submit">Salvar e entrar</button>
    <div class="err" id="trocaErr"></div>
  </form>
</section>

<div id="shell" class="hidden">
  <nav id="menu">
    <div class="brand">🛡️ Administração</div>
    <div class="nav-tools">
      <input id="menuBusca" type="search" placeholder="Buscar menu…" autocomplete="off">
      <label class="adv"><input type="checkbox" id="modoAvancado"> Modo avançado</label>
    </div>
  </nav>
  <main>
    <div class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <h2 id="titulo"></h2>
      </div>
      <div class="fill"></div>
      <a href="/" class="muted" style="text-decoration:none;font-size:12.5px">← Portal</a>
      <span class="muted" id="quem"></span>
      <button class="ghost" onclick="sair()">Desconectar</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div id="modal"></div>
<div id="toast" class="toast"></div>

<script>
function loadToken() {
  return localStorage.getItem('token') || sessionStorage.getItem('token') || '';
}
function saveToken(t) {
  if (t) { localStorage.setItem('token', t); sessionStorage.setItem('token', t); }
  else { localStorage.removeItem('token'); sessionStorage.removeItem('token'); }
}
let token = loadToken();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: {
    'Content-Type': 'application/json',
    ...(token ? { Authorization: 'Bearer ' + token } : {}), ...options.headers } });
  if (res.status === 401) { sair(); throw new Error('Sessão expirada'); }
  if (res.status === 403) throw new Error('Requer perfil administrador');
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `Erro ${res.status}`);
  return res.status === 204 ? null : res.json();
}

/* ---- UX helpers ---- */
const KEY_ADV = 'admin.modoAvancado';
const isAvancado = () => localStorage.getItem(KEY_ADV) === '1';
function setAvancado(on) {
  localStorage.setItem(KEY_ADV, on ? '1' : '0');
  montarMenu();
}
function toast(msg, ms = 2800) {
  const t = $('toast');
  if (!t) return alert(msg);
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(() => t.classList.remove('show'), ms);
}
const bannerWarn = (html) => `<div class="banner-warn">${html}</div>`;
const bannerInfo = (html) => `<div class="banner-info">${html}</div>`;
const quickBar = () => `
  <div class="quick-bar">
    <button type="button" onclick="janelaCameraRapida()">＋ Câmera</button>
    <button type="button" class="ghost" onclick="abrir('eventos')">Eventos</button>
    <button type="button" class="ghost" onclick="abrir('alm_fila')">Fila de alarmes</button>
    <button type="button" class="ghost" onclick="abrir('usrgrupos')">Grupos e acesso</button>
    <button type="button" class="ghost" onclick="abrir('saude')">Saúde</button>
  </div>`;

/* Aliases: ids antigos do menu → view real (deep-link / favoritos). */
const VIEW_ALIAS = {
  status: 'saude',
  disco: 'saude',
  atividade: 'saude',
  info: 'saude',
  alm_eventos: 'alm_fila',
  sca_presenca: 'sca_portas',
  politicas: 'sistema',
  servidores: 'midia',
};

/* ============================ ÁRVORE DE MENU ============================
   Agrupado por tarefa (Operação / Acesso / Config), não por histórico de código. */
const MENU = [
  { id:'operacao', nome:'Operação', itens:[
      { id:'cameras',   nome:'Câmeras' },
      { id:'saude',     nome:'Saúde do servidor' },
      { id:'eventos',   nome:'Eventos' },
  ]},
  { id:'automacao', nome:'Automação', itens:[
      { id:'automacao', nome:'Regras de automação' },
      { id:'evbotoes',  nome:'Botões de ação (eventos)' },
      { id:'contatos',  nome:'Contatos' },
      { id:'iodev',     nome:'Dispositivos I/O' },
  ]},
  { id:'acesso', nome:'Controle de acesso', itens:[
      { id:'sca_pessoas',    nome:'Pessoas e credenciais' },
      { id:'sca_portas',     nome:'Portas e presença' },
      { id:'sca_horarios',   nome:'Horários de acesso' },
      { id:'sca_visitantes', nome:'Visitantes' },
  ]},
  { id:'alarme', nome:'Alarmes', itens:[
      { id:'alm_fila',    nome:'Fila de tratamento' },
      { id:'alm_paineis', nome:'Painéis SIA' },
      { id:'alm_pop',     nome:'Templates POP' },
  ]},
  { id:'analise', nome:'Análise e mapas', itens:[
      { id:'mapas', nome:'Mapas sinópticos' },
      { id:'analitico', nome:'Analítico e VCA' },
      { id:'lpr',   nome:'Listas LPR' },
      { id:'faces', nome:'Busca facial' },
      { id:'ai',    nome:'IA servidor', avancado:true },
  ]},
  { id:'pessoas', nome:'Pessoas e permissões', itens:[
      { id:'usr',       nome:'Usuários' },
      { id:'usrgrupos', nome:'Grupos e acesso' },
      { id:'perfis',    nome:'Perfis de permissão', avancado:true },
      { id:'direitos',  nome:'Direitos avançados', avancado:true },
  ]},
  { id:'config', nome:'Configuração', itens:[
      { id:'sistema',  nome:'Sistema' },
      { id:'midia',    nome:'Perfis de stream' },
      { id:'licenca',  nome:'Licenciamento' },
      { id:'ipfilter', nome:'Filtros de IP', avancado:true },
      { id:'gmc',      nome:'Multi-tenant (GMC)', avancado:true },
      { id:'auditoria',nome:'Auditoria' },
  ]},
];

function montarMenu() {
  const nav = $('menu');
  nav.querySelectorAll('.node,.kids,.nav-empty').forEach(n => n.remove());
  const q = ($('menuBusca')?.value || '').trim().toLowerCase();
  const adv = isAvancado();
  let visiveis = 0;

  for (const ramo of MENU) {
    const itens = ramo.itens.filter(it => {
      if (it.soon) return false;
      if (it.avancado && !adv) return false;
      if (q && !it.nome.toLowerCase().includes(q) && !ramo.nome.toLowerCase().includes(q)) return false;
      return true;
    });
    if (!itens.length) continue;

    const raiz = document.createElement('div');
    raiz.className = 'node root';
    raiz.innerHTML = `<span class="caret">▼</span>${esc(ramo.nome)}`;
    nav.appendChild(raiz);

    const kids = document.createElement('div');
    kids.className = 'kids';
    nav.appendChild(kids);

    raiz.onclick = () => {
      kids.classList.toggle('collapsed');
      raiz.querySelector('.caret').textContent = kids.classList.contains('collapsed') ? '▶' : '▼';
    };

    for (const item of itens) {
      visiveis++;
      const folha = document.createElement('div');
      folha.className = 'node leaf';
      folha.dataset.view = item.id;
      folha.dataset.crumb = ramo.nome;
      folha.dataset.nome = item.nome;
      folha.textContent = item.nome;
      folha.onclick = (e) => { e.stopPropagation(); abrir(item.id); };
      kids.appendChild(folha);
    }
  }
  if (!visiveis) {
    const empty = document.createElement('div');
    empty.className = 'nav-empty muted';
    empty.style.cssText = 'padding:12px 16px;font-size:12px';
    empty.textContent = q ? 'Nenhum item para “' + q + '”.' : 'Nenhum item no menu.';
    nav.appendChild(empty);
  }
}

async function abrir(view) {
  const resolved = VIEW_ALIAS[view] || view;
  document.querySelectorAll('nav .leaf').forEach(n =>
    n.classList.toggle('active', n.dataset.view === resolved || n.dataset.view === view));
  const ativo = document.querySelector('nav .leaf.active');
  $('crumb').textContent = ativo?.dataset.crumb ?? '';
  $('titulo').textContent = ativo?.dataset.nome ?? resolved;
  $('view').innerHTML = '<p class="muted">Carregando…</p>';

  try { await (VIEWS[resolved] ?? VIEWS[view] ?? emBreve)(); }
  catch (e) { $('view').innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

const emBreve = async () => {
  $('view').innerHTML = `<div class="soonbox">
    <p style="margin:0 0 6px"><b>Área não disponível</b></p>
    <p class="muted" style="margin:0">Este item não está no menu simplificado.
      Ative <b>Modo avançado</b> na barra lateral se precisar de opções extras.</p></div>`;
};

/* ============================== JANELAS ============================== */
function janela({ titulo, corpo, rodape = '', largura }) {
  $('modal').innerHTML = `<div class="overlay" onclick="if(event.target===this)fecharJanela()">
    <div class="window" ${largura ? `style="width:min(${largura},94vw)"` : ''}>
      <div class="wtitle">${esc(titulo)}<button class="x" onclick="fecharJanela()">✕</button></div>
      <div class="wbody">${corpo}</div>
      ${rodape ? `<div class="wfoot">${rodape}</div>` : ''}
    </div></div>`;
}
function fecharJanela() {
  if (typeof pararPreviewCamera === 'function') pararPreviewCamera();
  $('modal').innerHTML = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharJanela(); });

/* ============================== LOGIN ============================== */
$('loginForm').onsubmit = async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const res = await fetch('/api/auth/login', { method:'POST',
    headers: { 'Content-Type':'application/json' },
    body: JSON.stringify(Object.fromEntries(new FormData(e.target))) });
  const d = await res.json();

  if (!d.ok) {
    if (d.twoFactorRequired) $('totp').classList.remove('hidden');
    $('loginErr').textContent = d.error || 'Falha no login';
    return;
  }
  token = d.token; saveToken(token);

  if (d.mustChangePassword) {
    // Reaproveita a senha digitada para não pedir duas vezes a mesma coisa.
    $('login').classList.add('hidden');
    $('troca').classList.remove('hidden');
    $('trocaForm').currentPassword.value = $('loginForm').password.value;
    $('trocaForm').newPassword.focus();
    return;
  }
  iniciar();
};

// Regras espelhadas do servidor — o servidor continua sendo a autoridade.
const REGRAS = [
  { t:'Mínimo de 10 caracteres', ok: p => p.length >= 10 },
  { t:'Uma letra maiúscula',     ok: p => /[A-Z]/.test(p) },
  { t:'Uma letra minúscula',     ok: p => /[a-z]/.test(p) },
  { t:'Um número',               ok: p => /[0-9]/.test(p) },
  { t:'Um caractere especial',   ok: p => /[^A-Za-z0-9]/.test(p) },
];

function pintarRegras(senha = '') {
  $('regras').innerHTML = REGRAS.map(r => {
    const ok = r.ok(senha);
    return `<li style="color:${ok ? '#3fb950' : '#8b949e'}">${ok ? '✓' : '○'} ${r.t}</li>`;
  }).join('');
}
pintarRegras();
$('trocaForm').newPassword.addEventListener('input', e => pintarRegras(e.target.value));

$('trocaForm').onsubmit = async e => {
  e.preventDefault();
  $('trocaErr').textContent = '';
  const dados = Object.fromEntries(new FormData(e.target));

  const falha = REGRAS.find(r => !r.ok(dados.newPassword));
  if (falha) { $('trocaErr').textContent = `A nova senha não atende: ${falha.t.toLowerCase()}.`; return; }

  try {
    await api('/api/auth/change-password', { method:'POST', body: JSON.stringify(dados) });
    $('troca').classList.add('hidden');
    e.target.reset(); pintarRegras();
    iniciar();
  } catch (err) { $('trocaErr').textContent = err.message; }
};

function sair() {
  token = ''; saveToken(''); fecharJanela();
  $('shell').classList.add('hidden');
  $('troca').classList.add('hidden');
  $('login').classList.remove('hidden');
}

async function iniciar() {
  try {
    const me = await api('/api/auth/me');
    if (!me.isAdmin) {
      $('login').classList.remove('hidden');
      $('shell').classList.add('hidden');
      $('loginErr').textContent = 'Este usuário não é administrador. Entre com uma conta admin.';
      return;
    }
    $('login').classList.add('hidden');
    $('shell').classList.remove('hidden');
    $('quem').textContent = me.fullName || me.username;
    // Em iframe (posto unificado): link “Portal” vira voltar ao posto.
    if (window.self !== window.top) {
      const a = document.querySelector('.topbar a[href="/"]');
      if (a) { a.href = '/monitor.html?view=config'; a.textContent = '← Posto'; a.target = '_parent'; }
    }
    const adv = $('modoAvancado');
    if (adv) {
      adv.checked = isAvancado();
      adv.onchange = () => setAvancado(adv.checked);
    }
    const busca = $('menuBusca');
    if (busca) {
      busca.oninput = () => montarMenu();
      busca.onkeydown = e => {
        if (e.key === 'Enter') {
          const first = document.querySelector('nav .leaf');
          if (first) abrir(first.dataset.view);
        }
      };
    }
    montarMenu();
    const q = new URLSearchParams(location.search);
    const v = q.get('view') || (location.hash || '').replace(/^#/, '') || 'cameras';
    const alias = typeof VIEW_ALIAS !== 'undefined' && VIEW_ALIAS[v] ? VIEW_ALIAS[v] : v;
    abrir(alias || 'cameras');
  } catch (e) {
    $('login').classList.remove('hidden');
    $('shell').classList.add('hidden');
    $('loginErr').textContent = e.message || 'Falha ao iniciar administração.';
  }
}

VIEWS.faces = async () => {
  const st = await api('/api/vms/faces/status').catch(e => ({ licensed:false, error:e.message }));
  if (!st.licensed) {
    $('view').innerHTML = `
      <div class="panel">
        <h3>Busca facial — módulo de licença</h3>
        <p class="err">Módulo não licenciado (<code>AnalyticsFacial</code>).</p>
        <p>Instale uma licença com <b>Analytics Facial = Sim</b> em
          <a href="#licenca" onclick="abrir('licenca');return false">Licenciamento</a>.</p>
        <p class="hint">Engine: ${esc(st.engine||'—')} · dim ${st.featureDim||'—'} · limiar padrão ${st.defaultThreshold ?? '—'}</p>
        ${st.error ? `<p class="muted">${esc(st.error)}</p>` : ''}
      </div>`;
    return;
  }

  let list = [];
  try { list = await api('/api/vms/faces'); } catch (e) { list = []; }

  const thumb = f => f.hasEmbedding || f.photoUrl || f.photoPath
    ? `<img data-face-photo="${f.id}" alt="" style="width:40px;height:40px;object-fit:cover;border-radius:6px;background:#222;display:none">`
    : '<span class="muted">—</span>';

  $('view').innerHTML = `
    <div class="cards">
      <div class="card"><div class="lbl">Licença</div><div class="val ok">Facial</div>
        <div class="sub">${esc(st.edition||'')} · ${esc(st.engine||'')}</div></div>
      <div class="card"><div class="lbl">Galeria</div><div class="val">${list.length}</div>
        <div class="sub">${list.filter(x=>x.hasEmbedding).length} com fingerprint</div></div>
      <div class="card"><div class="lbl">Limiar</div><div class="val">${(st.defaultThreshold??0.78).toFixed(2)}</div>
        <div class="sub">similaridade cosseno</div></div>
    </div>

    <div class="panel">
      <h3>Buscar por imagem<span class="fill"></span>
        <button type="button" class="ghost" id="fSearchBtn">Buscar</button></h3>
      <div class="grid2">
        <label class="f">Foto de referência
          <input type="file" id="fSearchFile" accept="image/*">
        </label>
        <label class="f">Modo
          <select id="fMode">
            <option value="all">Galeria + câmeras + eventos</option>
            <option value="gallery">Só galeria</option>
            <option value="live">Só câmeras ao vivo</option>
            <option value="events">Só eventos históricos</option>
          </select>
        </label>
        <label class="f">Limiar (0.1–0.99)
          <input id="fThr" type="number" min="0.1" max="0.99" step="0.01" value="${st.defaultThreshold??0.78}">
        </label>
        <label class="f">Nome / Face ID (eventos)
          <input id="fFilterName" placeholder="opcional — filtra eventos">
        </label>
      </div>
      <div id="fPreview" class="muted" style="margin:8px 0"></div>
      <div id="fSearchOut"></div>
      <p class="hint">Leve e rápido: fingerprint visual 64×64 via FFmpeg (sem GPU).
        Câmeras com faceId ISAPI/VAPIX também casam por ID externo na galeria.</p>
    </div>

    <div class="panel">
      <h3>Cadastrar rosto<span class="fill"></span>
        <button type="button" id="fAdd">Cadastrar</button></h3>
      <div class="grid2">
        <label class="f">Nome<input id="fNome" placeholder="Nome da pessoa"></label>
        <label class="f">Face ID (câmera)<input id="fId" placeholder="id externo ISAPI/VAPIX (opcional)"></label>
        <label class="f">Lista
          <select id="fList"><option value="watch">watch</option>
            <option value="allow">allow</option><option value="deny">deny</option></select>
        </label>
        <label class="f">Notas<input id="fNotes"></label>
        <label class="f">Foto (arquivo)<input type="file" id="fPhoto" accept="image/*"></label>
        <label class="f">ou URL / data URL<input id="fUrl" placeholder="https://… ou data:image/…"></label>
      </div>
      <div class="err" id="fErr"></div>
    </div>

    <div class="panel">
      <h3>Galeria — ${list.length}<span class="fill"></span>
        <button type="button" class="ghost" onclick="abrir('faces')">Atualizar</button></h3>
      <table><thead><tr>
        <th></th><th>Nome</th><th>Face ID</th><th>Lista</th><th>FP</th><th>Notas</th><th></th>
      </tr></thead>
      <tbody>${list.map(f => `<tr>
        <td>${thumb(f)}</td>
        <td><b>${esc(f.name)}</b></td>
        <td><code>${esc(f.externalFaceId||'—')}</code></td>
        <td>${esc(f.listType||'watch')}</td>
        <td class="${f.hasEmbedding?'ok':'muted'}">${f.hasEmbedding?'✓':'—'}</td>
        <td class="muted">${esc(f.notes||'')}</td>
        <td><button class="danger" data-delf="${f.id}">Excluir</button></td>
      </tr>`).join('') || '<tr><td colspan="7" class="muted">Galeria vazia — cadastre um rosto com foto.</td></tr>'}
      </tbody></table>
    </div>`;

  const fileToDataUrl = file => new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('Falha ao ler arquivo'));
    r.readAsDataURL(file);
  });

  // Fotos da galeria exigem Bearer — carrega via fetch autenticado.
  $('view').querySelectorAll('img[data-face-photo]').forEach(async img => {
    try {
      const id = img.getAttribute('data-face-photo');
      const res = await fetch(`/api/vms/faces/${id}/photo`, {
        headers: { Authorization: 'Bearer ' + token }
      });
      if (!res.ok) return;
      const blob = await res.blob();

      img.style.display = '';

  $('fSearchFile').onchange = async () => {

      ? `<img src="${url}" alt="probe" style="max-height:120px;border-radius:8px;border:1px solid #30363d">`

        take: 20,
        maxCameras: 16,

      const r = await api('/api/vms/faces/search', { method:'POST', body: JSON.stringify(body) });
      const gallery = Array.isArray(r.gallery) ? r.gallery : [];
      const liveMatches = r.live?.matches || [];
      const liveScanned = r.live?.scanned || [];
      const events = Array.isArray(r.events) ? r.events : [];

      $('fSearchOut').innerHTML = `
        ${r.probeError ? `<p class="muted">${esc(r.probeError)}</p>` : ''}
        <div class="grid2" style="gap:12px;margin-top:8px">
          <div>
            <h4 style="margin:0 0 8px">Galeria (${gallery.length})</h4>
            <table><thead><tr><th>Nome</th><th>Score</th><th>Lista</th></tr></thead>
            <tbody>${gallery.map(h => `<tr>
              <td><b>${esc(h.name)}</b></td>
              <td class="ok">${(h.score*100).toFixed(1)}%</td>
              <td>${esc(h.listType||'')}</td>
            </tr>`).join('') || '<tr><td colspan="3" class="muted">Nenhum match.</td></tr>'}
            </tbody></table>
          </div>
          <div>
            <h4 style="margin:0 0 8px">Câmeras ao vivo (${liveMatches.length}/${liveScanned.length})</h4>
            <table><thead><tr><th>Câmera</th><th>Score</th><th></th></tr></thead>
            <tbody>${(liveScanned.length?liveScanned:liveMatches).slice(0,20).map(h => `<tr>
              <td>${esc(h.cameraName||('#'+h.cameraId))}</td>
              <td class="${h.score>=(r.threshold||0.78)?'ok':'muted'}">${h.snapshotOk?(h.score*100).toFixed(1)+'%':'—'}</td>
              <td class="muted">${esc(h.error||'')}</td>
            </tr>`).join('') || '<tr><td colspan="3" class="muted">Sem varredura.</td></tr>'}
            </tbody></table>
          </div>
        </div>

/** Cadastro rápido em 3 passos (caminho feliz). */
async function janelaCameraRapida(prefill = null) {
  const drivers = window.__drivers || await api('/api/drivers');
  window.__drivers = drivers;
  const opts = drivers.map(d =>
    `<option value="${d.name}" ${ (prefill?.driver || 'hikvision') === d.name ? 'selected' : ''}>${d.name}</option>`).join('');
  let step = 1;
  let createdId = null;

  const render = () => {
    janela({
      titulo: 'Adicionar câmera',
      largura: '560px',
      corpo: `
        <div class="steps">
          <span class="step ${step===1?'on':step>1?'done':''}">1 · Conectar</span>
          <span class="step ${step===2?'on':step>2?'done':''}">2 · Verificar</span>
          <span class="step ${step===3?'on':''}">3 · Gravação</span>
        </div>
        <form id="fCamRapida">
          <div id="camStep1" class="${step===1?'':'hidden'}">
            <div class="grid2">
              <label class="f">Nome<input name="name" required value="${esc(prefill?.name || '')}" placeholder="Portaria"></label>
              <label class="f">Driver<select name="driver">${opts}</select></label>
              <label class="f">IP / host<input name="host" required value="${esc(prefill?.host || '')}" placeholder="192.168.1.64"></label>
              <label class="f">Porta HTTP<input name="port" type="number" value="${prefill?.port ?? 80}"></label>
              <label class="f">Usuário<input name="username" value="${esc(prefill?.username || 'admin')}"></label>
              <label class="f">Senha<input name="password" type="password" value="${esc(prefill?.password || '')}"></label>
            </div>
            <p class="hint">Hikvision/Dahua: use a porta <b>HTTP (80)</b> do web, não a 8000 do SDK.</p>
            <div id="camRapidaTest" class="muted" style="min-height:18px;margin-top:8px"></div>
          </div>
          <div id="camStep2" class="${step===2?'':'hidden'}">
            <div class="cam-preview" style="grid-template-columns:1fr">
              <div class="cam-preview-box" id="camRapidaBox">
                <img id="camRapidaImg" alt="snapshot" style="display:none">
                <div class="pv-status" id="camRapidaSt">Salve no passo 1 para ver o snapshot.</div>
              </div>
            </div>
            <p class="hint">Se o snapshot falhar, confira IP, usuário/senha e se a porta HTTP está correta. Você pode seguir e ajustar depois.</p>
          </div>
          <div id="camStep3" class="${step===3?'':'hidden'}">
            <div class="grid2">
              <label class="f">Modo de gravação<select name="recording">
                <option value="Continuous" selected>Contínua (recomendado)</option>
                <option value="OnEvent">Só por evento</option>
                <option value="Off">Desligada</option>
              </select></label>
              <label class="f">Retenção (dias)<input name="retentionDays" type="number" min="1" value="7"></label>
            </div>
            <p class="hint">Perfis de stream, PTZ, grupos e edge pull ficam em <b>Configurar</b> depois de salvar.</p>
          </div>
        </form>`,
      rodape: `
        <button type="button" class="ghost" onclick="fecharJanela()">Cancelar</button>
        <button type="button" class="ghost" id="camRapidaAdv">Opções avançadas…</button>
        ${step > 1 ? '<button type="button" class="ghost" id="camRapidaBack">← Voltar</button>' : ''}
        ${step === 1 ? '<button type="button" class="ghost" id="camRapidaTestBtn">Testar</button>' : ''}
        <button type="button" id="camRapidaNext">${step < 3 ? 'Continuar →' : 'Concluir'}</button>`
    });

    $('camRapidaAdv').onclick = () => {
      fecharJanela();
      if (createdId) janelaCamera(createdId);
      else {
        const f = $('fCamRapida');
        const fd = Object.fromEntries(new FormData(f));
        window.__camPrefill = fd;
        janelaCamera();
      }
    };
    const back = $('camRapidaBack');
    if (back) back.onclick = () => { step = Math.max(1, step - 1); render(); };
    const testBtn = $('camRapidaTestBtn');
    if (testBtn) testBtn.onclick = async () => {
      const f = $('fCamRapida');
      const body = Object.fromEntries(new FormData(f));
      body.port = +body.port || 80;
      $('camRapidaTest').textContent = 'Testando…';
      try {
        const r = await api('/api/admin/cameras/test', { method:'POST', body: JSON.stringify(body) });
        $('camRapidaTest').innerHTML = r.online
          ? `<span class="ok">✓ Conectou (${esc(r.driver)})</span>`
          : `<span class="off">✗ Sem resposta em ${esc(body.host)}:${body.port}</span>`;
      } catch (e) {
        $('camRapidaTest').innerHTML = '<span class="off">' + esc(e.message) + '</span>';
      }
    };
    $('camRapidaNext').onclick = async () => {
      const f = $('fCamRapida');
      if (step === 1) {
        if (!f.reportValidity()) return;
        const body = Object.fromEntries(new FormData(f));
        body.port = +body.port || 80;
        body.recording = 'Continuous';
        body.retentionDays = 7;
        body.recordAudio = true;
        try {
          if (!createdId) {
            const r = await api('/api/vms/cameras', { method:'POST', body: JSON.stringify(body) });
            createdId = r.id ?? r.Id;
            toast('Câmera criada #' + createdId);
          } else {
            await api('/api/admin/cameras/' + createdId, { method:'PUT', body: JSON.stringify(body) });
          }
          step = 2;
          render();
          setTimeout(() => carregarSnapshotRapida(createdId), 250);
        } catch (e) { toast(e.message); }
        return;
      }
      if (step === 2) { step = 3; render(); return; }
      if (step === 3) {
        const body = {
          recording: f.recording.value,
          retentionDays: +f.retentionDays.value || 7
        };
        try {
          await api('/api/admin/cameras/' + createdId, { method:'PUT', body: JSON.stringify(body) });
          toast('Câmera pronta');
          fecharJanela();
          abrir('cameras');
        } catch (e) { toast(e.message); }
      }
    };
  };
  render();
}

async function carregarSnapshotRapida(id) {
  const box = $('camRapidaBox');
  const img = $('camRapidaImg');
  const st = $('camRapidaSt');
  if (!box || !img || !st) return;
  st.className = 'pv-status loading';
  st.textContent = 'Carregando snapshot…';
  try {
    const res = await fetch(`/api/vms/cameras/${id}/snapshot?_=${Date.now()}`, {
      headers: { Authorization: 'Bearer ' + token, Accept: 'image/jpeg,image/*' },
      cache: 'no-store'
    });
    if (!res.ok) throw new Error('Snapshot indisponível (' + res.status + ')');
    const blob = await res.blob();
    if (!blob || blob.size < 32) throw new Error('Imagem vazia');
    img.src = await blobToDataUrl(blob);
    img.style.display = 'block';
    box.classList.add('has-img');
    st.className = 'pv-status ok';
    st.textContent = 'Snapshot OK · ' + (blob.size / 1024).toFixed(0) + ' KB';
  } catch (e) {
    st.className = 'pv-status err';
    st.textContent = e.message || 'Falha no snapshot — pode continuar e ajustar depois';
  }
}

  });

      previewSnapshot(id).then(() => previewLive(id));

  });

  // Snapshot inicial na aba geral.
  if (id) setTimeout(() => previewSnapshot(id, true), 200);
}

/* ============================== PREVIEW CÂMERA ============================== */
let _pvHls = null;
let _pvTimer = null;
let _pvGen = 0;

function pararPreviewCamera() {
  _pvGen++;
  clearInterval(_pvTimer);
  _pvTimer = null;
  try { _pvHls?.destroy(); } catch { /* */ }
  _pvHls = null;
  const v = $('camPreviewVideo');
  if (v) {
    try { v.pause(); } catch { /* */ }
    v.removeAttribute('src');
    v.srcObject = null;
    try { v.load(); } catch { /* */ }
    v.style.display = 'none';
  }
}

function setPreviewStatus(msg, cls = '', mini = false) {
  const el = mini ? $('camPreviewStMini') : $('camPreviewSt');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'pv-status' + (cls ? ' ' + cls : '');
}

function applySnapshotToImg(img, dataUrl) {
  if (!img || !dataUrl) return;
  img.onload = () => {
    img.style.display = 'block';
    const box = img.closest('.cam-preview-box');
    if (box) box.classList.add('has-img');
  };
  img.onerror = () => {
    img.style.display = 'none';
    const box = img.closest('.cam-preview-box');
    if (box) box.classList.remove('has-img');
  };
  img.src = dataUrl;
  img.style.display = 'block';
  const box = img.closest('.cam-preview-box');
  if (box) box.classList.add('has-img');
}

/** Converte blob JPEG em data: URL (compatível com CSP img-src data:). */
function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = () => reject(new Error('falha ao ler imagem'));
    fr.readAsDataURL(blob);
  });
}

async function previewSnapshot(id, mini = false) {
  if (!id || !token) {
    setPreviewStatus(!token ? 'Sessão inválida — faça login de novo.' : 'Câmera inválida.', 'err', mini);
    return;
  }
  const imgMini = $('camPreviewImgMini');
  const imgFull = $('camPreviewImg');
  const video = $('camPreviewVideo');
  if (!imgMini && !imgFull) return;

  setPreviewStatus('Capturando snapshot...', 'loading', true);
  setPreviewStatus('Capturando snapshot...', 'loading', false);
  ['camPreviewBoxMini', 'camPreviewBox'].forEach(bid => {
    const box = $(bid);
    if (box) box.classList.remove('has-img');
  });

  try {
    const res = await fetch(`/api/vms/cameras/${id}/snapshot?_=${Date.now()}`, {
      headers: {
        Authorization: 'Bearer ' + token,
        Accept: 'image/jpeg,image/*,*/*',
        'Cache-Control': 'no-cache'
      },
      cache: 'no-store'
    });
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 120); } catch { /* */ }
      if (res.status === 503) throw new Error('camera sem imagem' + (detail ? ' - ' + detail : ''));
      if (res.status === 401 || res.status === 403) throw new Error('sem permissao para snapshot');
      throw new Error('erro ' + res.status + (detail ? ' - ' + detail : ''));
    }
    const blob = await res.blob();
    if (!blob || blob.size < 32) throw new Error('resposta vazia da camera');
    // data: URL — funciona com CSP img-src data: (blob: também liberado no servidor)
    const dataUrl = await blobToDataUrl(blob);

    applySnapshotToImg(imgMini, dataUrl);
    applySnapshotToImg(imgFull, dataUrl);

    // Snapshot na aba Preview esconde o vídeo ao vivo
    if (!mini && video) video.style.display = 'none';

    const when = new Date().toLocaleTimeString();
    setPreviewStatus('Snapshot atualizado · ' + when, 'ok', true);
    setPreviewStatus('Snapshot atualizado · ' + when, 'ok', false);

    const meta = $('camPreviewMeta');
    if (meta) meta.textContent = 'JPEG · ' + (blob.size / 1024).toFixed(0) + ' KB · ' + when;
  } catch (e) {
    const msg = e.message || String(e);
    setPreviewStatus(msg, 'err', true);
    setPreviewStatus(msg, 'err', false);
  }
}

async function previewLive(id) {
  if (!id || !token) return;
  const video = $('camPreviewVideo');
  const img = $('camPreviewImg');
  if (!video) return;

  const gen = ++_pvGen;
  try { _pvHls?.destroy(); } catch { /* */ }
  _pvHls = null;
  video.style.display = 'block';
  if (img) img.style.display = 'none';
  setPreviewStatus('Conectando ao vivo (MediaMTX)…');

  try {
    // Aguarda path ready (transcoder / pull).
    let s = null;
    for (let i = 0; i < 8; i++) {
      if (gen !== _pvGen) return;
      s = await api(`/api/vms/cameras/${id}/stream?quality=main`);
      if (s.ready) break;
      setPreviewStatus(`Aguardando stream no servidor… (${i + 1}/8)`);
      await new Promise(r => setTimeout(r, 1500));
    }
    if (gen !== _pvGen) return;
    if (!s?.hls) throw new Error('API não retornou URL HLS');

    const hlsUrl = s.hls;
    const jwt = (() => {
      try { return new URL(hlsUrl, location.origin).searchParams.get('jwt') || token; }
      catch { return token; }
    })();

    const playNative = () => {
      video.src = hlsUrl;
      video.muted = true;
      return video.play().then(() => true).catch(() => false);
    };

    let ok = false;
    if (window.Hls && Hls.isSupported()) {
      const BaseLoader = Hls.DefaultConfig.loader;
      class JwtLoader extends BaseLoader {
        load(context, config, callbacks) {
          if (jwt && context?.url && !String(context.url).includes('jwt=')) {
            context.url += (context.url.includes('?') ? '&' : '?') + 'jwt=' + encodeURIComponent(jwt);
          }
          super.load(context, config, callbacks);
        }
      }
      const hls = new Hls({
        lowLatencyMode: true,
        enableWorker: true,
        maxBufferLength: 6,
        loader: JwtLoader,
        manifestLoadingMaxRetry: 5,
        fragLoadingMaxRetry: 5
      });
      _pvHls = hls;
      await new Promise((resolve, reject) => {
        const t = setTimeout(() => reject(new Error('timeout HLS (12s)')), 12000);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play?.().catch(() => {});
        });
        hls.on(Hls.Events.FRAG_LOADED, () => {
          clearTimeout(t);
          ok = true;
          resolve();
        });
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (!d.fatal) return;
          clearTimeout(t);
          reject(new Error(d.details || 'erro HLS'));
        });
        hls.loadSource(hlsUrl);
        hls.attachMedia(video);
      });
    } else {
      ok = await playNative();
      if (!ok) throw new Error('autoplay bloqueado / HLS nativo falhou');
    }

    if (gen !== _pvGen) return;
    setPreviewStatus(
      `Ao vivo · path ${s.path || '—'} · ${s.transcoded ? 'H.264 (transcode)' : (s.codecHint || 'stream')}`,
      'ok');
    const meta = $('camPreviewMeta');
    if (meta) meta.textContent = `ready=${!!s.ready} · ${s.hls || ''}`;
  } catch (e) {
    if (gen !== _pvGen) return;
    setPreviewStatus((e.message || String(e)) + ' — use Snapshot se o live falhar', 'err');
    // Fallback visual: snapshot
    previewSnapshot(id);
  }
}

function dadosCamera() {
  const form = $('fCam');
  const f = Object.fromEntries(new FormData(form));
  f.port = +f.port;
  // FormData devolve tudo como texto; o servidor espera número nestes campos.
  for (const n of ['retentionDays', 'maxStorageGb', 'eventRecordSeconds'])
    if (f[n] !== undefined && f[n] !== '') f[n] = +f[n];
  // Checkbox: ausente = false.
  f.recordAudio = !!form.querySelector('[name=recordAudio]')?.checked;
  f.edgePullEnabled = !!form.querySelector('[name=edgePullEnabled]')?.checked;
  // Perfis: vazio = limpar associação.
  for (const n of ['recordingProfileId', 'liveProfileId']) {
    if (f[n] === '' || f[n] === undefined) {
      f[n] = null;
      if (n === 'recordingProfileId') f.clearRecordingProfile = true;
      if (n === 'liveProfileId') f.clearLiveProfile = true;
    } else {
      f[n] = +f[n];
    }
  }
  return f;
}

async function executarDescobertaCameras() {
  const out = $('discOut');
  if (!out) return;
  out.innerHTML = '<p class="muted">Procurando na rede e consultando NVRs cadastrados…</p>';
  const body = {
    username: $('discUser')?.value?.trim() || null,
    password: $('discPass')?.value || null,
    includeSkipped: !!$('discShowSkipped')?.checked
  };
  try {
    const r = await api('/api/admin/cameras/discover?timeoutSeconds=5', {
      method: 'POST',
      body: JSON.stringify(body)
    });
    // Compat: API antiga devolvia array puro; a nova devolve objeto.
    const list = Array.isArray(r) ? r : (r.devices || []);
    const skipped = Array.isArray(r) ? [] : (r.skipped || []);
    const foundTotal = Array.isArray(r) ? list.length : (r.foundTotal ?? list.length);
    const nvrSrc = Array.isArray(r) ? 0 : (r.nvrSourcesKnown ?? 0);

    if (!list.length && !skipped.length) {
      out.innerHTML = `<p class="off">Nenhum dispositivo respondeu (total: ${foundTotal}).</p>`;
      return;
    }

    const resumo = `<p class="hint" style="margin:0 0 8px">
      Encontrados: <b>${foundTotal}</b> · Avulsas: <b>${list.length}</b>
      · Filtradas: <b>${(r.skippedCount ?? skipped.length) || 0}</b>
      · Canais IP nos NVRs: <b>${nvrSrc}</b></p>`;

    const tabela = (rows, comAcao) => {
      if (!rows.length) return '<p class="muted">Nenhuma.</p>';
      return `<table><thead><tr>
        <th>Nome / OSD</th><th>Host</th><th>Driver</th><th>Motivo</th>${comAcao ? '<th></th>' : ''}
      </tr></thead><tbody>
      ${rows.map((d, i) => {
        const nome = d.osdName || d.name || d.host;
        const osdTag = d.osdName
          ? ` <span class="ok" title="OSD da câmera">OSD</span>`
          : '';
        let motivo = '—';
        if (d.onNvr) motivo = `NVR ${esc(d.nvrName || d.nvrHost || '')} · ch ${d.nvrChannelId ?? '?'}${d.nvrChannelName ? ' (' + esc(d.nvrChannelName) + ')' : ''}`;
        else if (d.alreadyRegistered) motivo = `já cadastrada #${d.registeredDeviceId}${d.registeredName ? ' · ' + esc(d.registeredName) : ''}`;
        return `<tr>
          <td><b>${esc(nome)}</b>${osdTag}</td>
          <td class="muted">${esc(d.host)}:${d.port || 80}</td>
          <td><code>${esc(d.driver || 'onvif')}</code></td>
          <td class="muted" style="font-size:12px">${motivo}</td>
          ${comAcao ? `<td><button class="ghost" data-disc-i="${i}">Cadastrar…</button></td>` : ''}
        </tr>`;
      }).join('')}</tbody></table>`;
    };

    out.innerHTML = resumo
      + '<p style="margin:8px 0 4px"><b>Câmeras avulsas</b> <span class="muted">(não estão no NVR nem no cadastro)</span></p>'
      + (list.length ? tabela(list, true) : '<p class="ok">Nenhuma avulsa nova — tudo já coberto por NVR/cadastro.</p>')
      + (skipped.length
        ? '<p style="margin:14px 0 4px"><b>Filtradas</b> <span class="muted">(não puxar)</span></p>' + tabela(skipped, false)
        : '');

    window.__disc = list;
    out.querySelectorAll('button[data-disc-i]').forEach(b => {
      b.onclick = () => {
        const d = window.__disc[+b.dataset.discI];
        if (!d) return;
        fecharJanela();
        janelaCameraRapida({
          name: d.osdName || d.name || d.host,
          host: d.host,
          port: d.port || 80,
          driver: d.driver || 'onvif',
          username: body.username || 'admin',
          password: body.password || ''
        });
      };
    });
  } catch (e) {
    out.innerHTML = `<p class="off">${esc(e.message)}</p>`;
  }
}

/* ------------------------- PTZ contínuo -------------------------
   O movimento vai enquanto o botão está pressionado. A plataforma usa
   velocidade normalizada em -1..1 nos três eixos; cada driver converte para a
   escala do fabricante. */
const ptzHold = (id, eixos) =>
  `onmousedown="ptzMove(${id},'${eixos}')" onmouseup="ptzStop(${id})" ` +
  `onmouseleave="ptzStop(${id})" ontouchstart="ptzMove(${id},'${eixos}')" ` +
  `ontouchend="ptzStop(${id})"`;

async function ptzMove(id, eixos) {
  const [pan, tilt, zoom] = eixos.split(',').map(Number);
  const v = (+($('ptzVel')?.value ?? 50)) / 100;
  const alvo = $('ptzOut');
  try {
    await api(`/api/vms/cameras/${id}/ptz/move`, { method:'POST', body: JSON.stringify({
      pan: pan * v, tilt: tilt * v, zoom: zoom * v, timeoutSeconds: 2 }) });
    if (alvo) alvo.innerHTML = '<span class="muted">movendo…</span>';
  } catch (e) { if (alvo) alvo.innerHTML = `<span class="off">${esc(e.message)}</span>`; }
}

    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()).slice(0, 160); } catch { /* */ }
      throw new Error(res.status === 503
        ? ('camera sem imagem' + (detail ? ' - ' + detail : ''))
        : ('erro ' + res.status + (detail ? ' - ' + detail : '')));
    }
    const blob = await res.blob();
    if (!blob || blob.size < 32) throw new Error('resposta vazia da camera');
    const dataUrl = await blobToDataUrl(blob);
    const when = new Date().toLocaleTimeString();
    alvo.innerHTML =
      '<img src="' + dataUrl + '" alt="snapshot" style="max-width:100%;border-radius:6px;border:1px solid #30363d;background:#000">' +
      '<p class="muted" style="margin-top:8px;font-size:11px">JPEG · ' + (blob.size / 1024).toFixed(0) + ' KB · ' + when + '</p>';
    applySnapshotToImg($('camPreviewImgMini'), dataUrl);
    applySnapshotToImg($('camPreviewImg'), dataUrl);
    setPreviewStatus('Snapshot atualizado · ' + when, 'ok', true);
    setPreviewStatus('Snapshot atualizado · ' + when, 'ok', false);
  } catch (e) {
    alvo.innerHTML = `<p class="off">${esc(e.message || String(e))}</p>`;
  }
}

async function addSlot(deviceId) {
  const dia = $('aDia').value;
  try {
    await api('/api/admin/schedules', { method:'POST', body: JSON.stringify({
      deviceId, kind:'Recording', day: dia === '' ? null : DIAS[+dia],
      start:`${$('aIni').value}:00`, end:`${$('aFim').value}:00`, enabled:true }) });
    janelaAgenda(deviceId);
  } catch (e) { $('aErr').textContent = e.message; }
}
async function delSlot(id, deviceId) {
  await api(`/api/admin/schedules/${id}`, { method:'DELETE' }); janelaAgenda(deviceId);
}

/* Filtra a trilha por texto livre, ação e resultado (tudo no cliente). */
const filtrarAudit = (logs, f) => logs.filter(a => {
  if (f.acao && a.action !== f.acao) return false;
  if (f.res === 'ok' && !a.success) return false;
  if (f.res === 'fail' && a.success) return false;
  if (f.q) {
    const blob = `${a.username} ${a.action} ${a.objectType} ${a.objectId} ${a.ipAddress} ${a.detail}`.toLowerCase();
    if (!blob.includes(f.q)) return false;
  }
  return true;
});

const tabelaAuditLinhas = (logs) => `

    <td><b>${esc(a.username)}</b></td><td><code>${esc(a.action)}</code></td>
    <td class="muted">${esc(a.objectType)}${a.objectId ? ' ' + esc(a.objectId) : ''}</td>
    <td class="${a.success ? 'ok' : 'off'}">${a.success ? '✓' : '✗ falha'}</td>
    <td class="muted">${esc(a.ipAddress)}</td>
    <td class="muted" style="font-size:11px">${esc(a.detail)}</td>
  </tr>`).join('') || '<tr><td colspan="7" class="muted">Nenhum registro para o filtro atual.</td></tr>'}
  </tbody></table>`;

/* ---- exportação da auditoria (CSV / PDF) ---- */
const carimboArquivo = () => new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');

function baixarArquivo(conteudo, nome, tipo) {
  const url = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportarAuditCsv(logs) {
  const cab = ['Quando', 'Usuário', 'Ação', 'Tipo objeto', 'ID objeto', 'Resultado', 'IP', 'Detalhe'];
  const linhas = logs.map(a => [
    new Date(a.createdAt).toLocaleString(), a.username, a.action, a.objectType,
    a.objectId, a.success ? 'sucesso' : 'falha', a.ipAddress, a.detail]);
  const csv = [cab, ...linhas]
    .map(r => r.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n');
  baixarArquivo('﻿' + csv, `auditoria-${carimboArquivo()}.csv`, 'text/csv;charset=utf-8');
}

function exportarAuditPdf(logs) {
  const w = window.open('', '_blank');
  if (!w) { alert('Permita pop-ups para gerar o PDF.'); return; }
  const linhas = logs.map(a => `<tr>
    <td>${new Date(a.createdAt).toLocaleString()}</td><td>${esc(a.username)}</td>
    <td>${esc(a.action)}</td><td>${esc(a.objectType)}${a.objectId ? ' ' + esc(a.objectId) : ''}</td>
    <td class="${a.success ? 'ok' : 'off'}">${a.success ? 'sucesso' : 'falha'}</td>
    <td>${esc(a.ipAddress)}</td><td>${esc(a.detail)}</td></tr>`).join('');
  w.document.write(`<!doctype html><html lang="pt-br"><head><meta charset="utf-8">
    <title>Auditoria ${carimboArquivo()}</title><style>
      body{font:12px/1.4 system-ui,sans-serif;color:#111;margin:24px;}
      h1{font-size:16px;margin:0 0 2px;} .meta{color:#555;font-size:11px;margin-bottom:14px;}
      table{width:100%;border-collapse:collapse;} th,td{text-align:left;padding:4px 6px;border-bottom:1px solid #ddd;vertical-align:top;}
      th{background:#f0f0f0;font-size:10px;text-transform:uppercase;letter-spacing:.05em;}
      .ok{color:#137333;} .off{color:#c5221f;} @media print{body{margin:0;}}
    </style></head><body>
    <h1>Trilha de auditoria</h1>
    <div class="meta">Gerado em ${new Date().toLocaleString()} — ${logs.length} registros</div>
    <table><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Objeto</th>
      <th>Resultado</th><th>IP</th><th>Detalhe</th></tr></thead>
    <tbody>${linhas || '<tr><td colspan="7">Nenhum registro.</td></tr>'}</tbody></table>
    <scr` + `ipt>window.onload=()=>{window.print();}<\/scr` + `ipt></body></html>`);
  w.document.close();
}

function summarizeActions(json) {
  try {
    const a = JSON.parse(json || '[]');
    if (!Array.isArray(a) || !a.length) return '—';
    return a.map(x => x.kind).join(' · ');
  } catch { return (json || '').slice(0, 40); }
}

function formatAgenda(r) {
  const days = (r.scheduleDays || '*').trim();
  const dlab = (!days || days === '*' || days === '0,1,2,3,4,5,6')
    ? 'todos os dias'
    : days.split(',').map(x => DAY_LABELS[+x] || x).join(',');
  const t = `${r.scheduleStart || '00:00'}–${r.scheduleEnd || '23:59'}`;
  const cd = r.cooldownSeconds > 0 ? ` · timer ${r.cooldownSeconds}s` : '';
  return `${dlab} · ${t}${cd}`;
}

function aplicarTemplate(t) {

    scheduleDays: '0,1,2,3,4,5,6',
    scheduleStart: '00:00',
    scheduleEnd: '23:59',
    actions: JSON.stringify(t.actions || [], null, 0),
    enabled: true
  });
}

function dayChecksHtml(selected) {
  const set = new Set(String(selected || '0,1,2,3,4,5,6').split(',').map(s => s.trim()));
  const all = set.has('*') || set.size === 0;
  return DAY_LABELS.map((lab, i) =>
    `<label style="margin-right:8px;font-size:12px"><input type="checkbox" class="rDay" value="${i}"
      ${(all || set.has(String(i))) ? 'checked' : ''}> ${lab}</label>`).join('');
}

function actionChecksFromJson(json) {
  let acts = [];
  try { acts = JSON.parse(json || '[]'); } catch { acts = []; }
  const has = k => acts.some(a => (a.kind || '').toLowerCase() === k.toLowerCase());
  const get = k => acts.find(a => (a.kind || '').toLowerCase() === k.toLowerCase()) || {};
  return { has, get, acts };
}

function coletarAcoesDaUi() {
  if ($('rUseJson')?.checked) {
    const raw = $('rAct').value;
    JSON.parse(raw);
    return raw;
  }
  const acts = [];
  if ($('aPopup')?.checked)
    acts.push({ kind: 'PopupVideo', secondsAfter: +$('aPopupSec').value || 20 });
  if ($('aSound')?.checked)
    acts.push({ kind: 'PlaySound', title: 'alarm' });
  if ($('aLive')?.checked)
    acts.push({ kind: 'OpenLive' });
  if ($('aPb')?.checked)
    acts.push({ kind: 'OpenPlayback' });
  if ($('aMap')?.checked)
    acts.push({ kind: 'OpenMap' });
  if ($('aEmail')?.checked)
    acts.push({ kind: 'Email', subject: '[VMS] Alerta de automação' });
  if ($('aBm')?.checked)
    acts.push({ kind: 'Bookmark', secondsBefore: 30, secondsAfter: 60, title: 'Auto' });
  if ($('aPtz')?.checked)
    acts.push({ kind: 'PtzPreset', preset: +$('aPtzN').value || 1 });
  if ($('aRelay')?.checked) {
    const o = { kind: 'OutputRelay', channel: +$('aRelayCh').value || 1, pulseMs: +$('aRelayMs').value || 1000 };
    if ($('aRelayDev').value) o.deviceId = +$('aRelayDev').value;
    acts.push(o);
  }
  if ($('aHttp')?.checked && $('aHttpUrl').value.trim())
    acts.push({ kind: 'HttpRequest', url: $('aHttpUrl').value.trim(), method: 'POST' });
  if (!acts.length) throw new Error('Marque ao menos uma ação.');
  return JSON.stringify(acts);
}

function coletarDias() {
  const boxes = [...document.querySelectorAll('.rDay:checked')].map(b => b.value);
  if (!boxes.length || boxes.length === 7) return '0,1,2,3,4,5,6';
  return boxes.join(',');
}

async function salvarRegra(id) {
  $('rErr').textContent = '';
  let actions;
  try { actions = coletarAcoesDaUi(); }
  catch (e) { $('rErr').textContent = e.message || 'Ações inválidas.'; return; }

  const body = {
    name: $('rNome').value,
    whenEventType: $('rEvt').value || '*',
    whenDeviceId: $('rDev').value === '' ? 0 : +$('rDev').value,
    clearDevice: $('rDev').value === '',
    minSeverity: +$('rSev').value || 1,
    scheduleDays: coletarDias(),
    scheduleStart: $('rStart').value || '00:00',
    scheduleEnd: $('rEnd').value || '23:59',
    timeZone: $('rTz').value || 'America/Sao_Paulo',
    cooldownSeconds: +$('rCool').value || 0,
    actions,
    enabled: $('rEn').checked
  };
  try {
    if (id) await api('/api/admin/automation/' + id, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/api/admin/automation', { method: 'POST', body: JSON.stringify(body) });
    fecharJanela(); abrir('automacao');
  } catch (e) { $('rErr').textContent = e.message; }
}
async function toggleRegra(id, on) {
  await api(`/api/admin/automation/${id}/enabled/${on}`, { method:'POST' }); abrir('automacao');
}
async function delRegra(id) {
  if (!confirm('Excluir esta regra?')) return;
  await api(`/api/admin/automation/${id}`, { method:'DELETE' }); abrir('automacao');
}

/** Janela única de configuração: criação e edição usam o mesmo formulário. */
async function janelaGrupoUsr(id) {
  const [roles, cgs, cams, us] = await Promise.all([
    api('/api/roles'), api('/api/admin/camera-groups'),
    api('/api/vms/cameras'), api('/api/users')]);

  const g = id ? await api(`/api/groups/${id}`) : null;
  const acessos = g?.acessos ?? [];

  // Reconstrói o estado do formulário a partir dos direitos gravados.
  const permitido = a => a.effect === 'Allow' && a.objectId !== null;
  const marcadosCg = acessos.filter(a => a.objectType === 'cameragroup' && permitido(a))
                            .map(a => a.objectId);
  const marcadasCam = acessos.filter(a => a.objectType === 'camera' && permitido(a))
                             .map(a => a.objectId);
  const negadas = acessos.filter(a => a.effect === 'Deny' && a.objectId !== null)
                         .map(a => a.objectId);
  const todas = acessos.some(a => a.objectType === 'camera' && a.objectId === null
                                && a.effect === 'Allow');
  const membros = (g?.membros ?? []).map(m => m.id);

  const caixa = (lista, marcados, prefixo) => lista.length
    ? lista.map(x => `<label style="display:flex;align-items:center;gap:6px;padding:2px 0">
        <input type="checkbox" class="${prefixo}" value="${x.id}"
          ${marcados.includes(x.id) ? 'checked' : ''}> ${esc(x.name)}</label>`).join('')
    : '<span class="muted">nenhum cadastrado</span>';

  const rolagem = 'max-height:170px;overflow:auto;border:1px solid #2a3344;border-radius:6px;padding:8px';

  janela({
    titulo: id ? `Configurar acesso — ${g.name}` : 'Novo grupo de usuários',
    largura: '880px',
    corpo: `
      <input type="hidden" id="agId" value="${id ?? ''}">
      <div class="grid2">
        <label class="f">Nome do grupo<input id="agNome" value="${esc(g?.name ?? '')}"></label>
        <label class="f">Perfil — o que o grupo pode fazer
          <select id="agPerfil">
            <option value="">Nenhum (não concede nada)</option>
            ${roles.map(r => `<option value="${r.id}" ${g?.roleId === r.id ? 'selected' : ''}
              >${esc(r.name)}</option>`).join('')}
          </select></label>
      </div>
      <label class="f">Descrição<input id="agDesc" value="${esc(g?.description ?? '')}"></label>
      <div id="agPerms" class="hint" style="margin:6px 0 12px"></div>

      <div class="grid2">
        <div><p style="margin:0 0 6px"><b>Alcance — sobre quais câmeras</b></p>
          <label style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <input type="checkbox" id="agTodas" ${todas ? 'checked' : ''}>
            <b>Todas as câmeras</b></label>
          <div id="agEscopo">
            <p class="muted" style="margin:8px 0 4px">Grupos de câmeras (inclui subgrupos)</p>
            <div style="${rolagem}">${caixa(cgs, marcadosCg, 'agCg')}</div>
            <p class="muted" style="margin:10px 0 4px">Câmeras avulsas</p>
            <div style="${rolagem}">${caixa(cams, marcadasCam, 'agCam')}</div>
          </div>
        </div>
        <div><p style="margin:0 0 6px"><b>Exceções — negar (vence tudo)</b></p>
          <div style="${rolagem}">${caixa(cams, negadas, 'agNeg')}</div>
          <p style="margin:14px 0 6px"><b>Membros</b></p>
          <div style="${rolagem}">${caixa(
            us.map(u => ({ id: u.id, name: u.username + (u.active ? '' : ' (inativo)') })),
            membros, 'agUsr')}</div>
        </div>
      </div>

      <div class="panel" style="margin:14px 0 0;background:#141b26">
        <b>Prévia</b> <span class="muted">— o que os membros verão ao salvar</span>
        <div id="agPrevia" class="muted" style="margin-top:6px">calculando…</div>
      </div>
      <div class="err" id="agErr"></div>`,
    rodape: `<button class="ghost" onclick="fecharJanela()">Cancelar</button>
             <button onclick="salvarGrupoAcesso()">${id ? 'Salvar acesso' : 'Criar e configurar'}</button>`
  });

  const mostrarPerms = () => {
    const r = roles.find(x => x.id === +$('agPerfil').value);
    if (!r) {
      $('agPerms').innerHTML = '<span class="warn">Sem perfil, o grupo não concede permissão alguma — só o alcance de câmeras não basta.</span>';
      return;
    }
    $('agPerms').innerHTML =
      `<div style="margin-bottom:4px"><b>Este perfil libera:</b></div>
       <div>${chipsPerms(r.permissoes)}</div>
       <details style="margin-top:6px"><summary class="muted" style="cursor:pointer">O que cada permissão faz</summary>
         <div style="margin-top:6px">${listaPermsDetalhe(r.permissoes)}</div>
       </details>`;
  };

  const alternarEscopo = () => {
    const off = $('agTodas').checked;
    $('agEscopo').style.opacity = ($('agEscopo').inert = off) ? .4 : 1;
  };

  let timer;
  const atualizarPrevia = () => { clearTimeout(timer); timer = setTimeout(previaGrupo, 180); };

  $('agPerfil').onchange = () => { mostrarPerms(); atualizarPrevia(); };
  $('agTodas').onchange = () => { alternarEscopo(); atualizarPrevia(); };
  document.querySelectorAll('.agCg,.agCam,.agNeg')
    .forEach(el => el.onchange = atualizarPrevia);

  mostrarPerms(); alternarEscopo(); previaGrupo();
}

/** Estado atual do formulário, no formato que o servidor espera. */
function formGrupoAcesso() {
  const marcados = cls => [...document.querySelectorAll('.' + cls + ':checked')].map(i => +i.value);
  return {
    roleId: $('agPerfil').value ? +$('agPerfil').value : null,
    name: $('agNome').value.trim(),
    description: $('agDesc').value,
    allCameras: $('agTodas').checked,
    cameraGroupIds: $('agTodas').checked ? [] : marcados('agCg'),
    cameraIds: $('agTodas').checked ? [] : marcados('agCam'),
    deniedCameraIds: marcados('agNeg'),
    userIds: marcados('agUsr')
  };
}

/* A prévia existe para o administrador confiar no que vai salvar, então ela
   nunca pode mostrar um resultado que não corresponde ao formulário atual.
   Sem o selo abaixo, duas chamadas sobrepostas deixam vencer a última que
   *responde* — não a última que foi *pedida* —, e uma resposta atrasada
   sobrescreve a mais nova com dados velhos. */
let previaSelo = 0;

async function previaGrupo() {
  const alvo = $('agPrevia'); if (!alvo) return;
  const meu = ++previaSelo;

  try {
    const p = await api('/api/groups/preview', {
      method:'POST', body: JSON.stringify(formGrupoAcesso()) });
    if (meu !== previaSelo) return;             // já há um pedido mais novo

    alvo.innerHTML = p.total === 0
      ? '<span class="warn">Nenhuma câmera — os membros não verão nada.</span>'
      : `<span class="ok">${p.total} câmera(s):</span> ` +
        p.cameras.map(c => esc(c.name)).join(' · ') +
        (p.permissoes.length ? '' : ' <span class="warn">(sem perfil, nada é concedido)</span>');
  } catch (e) {
    if (meu === previaSelo) alvo.innerHTML = `<span class="off">${esc(e.message)}</span>`;
  }
}

async function salvarGrupoAcesso() {
  const form = formGrupoAcesso();
  if (!form.name) { $('agErr').textContent = 'Informe o nome do grupo.'; return; }

  try {
    // Grupo novo precisa existir antes de receber o acesso; as duas chamadas
    // ficam invisíveis para quem usa a tela.
    let id = $('agId').value;
    if (!id) {
      const novo = await api('/api/groups', { method:'POST',
        body: JSON.stringify({ name: form.name, description: form.description }) });
      id = novo.id;
    }
    await api(`/api/groups/${id}/access`, { method:'PUT', body: JSON.stringify(form) });
    fecharJanela(); abrir('usrgrupos');
  } catch (e) { $('agErr').textContent = e.message; }
}

async function duplicarGrupoUsr(id) {
  await api(`/api/groups/${id}/duplicate`, { method:'POST' });
  abrir('usrgrupos');
}
async function excluirGrupoUsr(id) {
  if (!confirm('Excluir este grupo? Os direitos e os vínculos dos membros vão junto.')) return;
  try { await api(`/api/groups/${id}`, { method:'DELETE' }); abrir('usrgrupos'); }
  catch (e) { $('ugErr').textContent = e.message; }
}

    naoFaz: 'Somente leitura — não apaga nem altera o log.'

const PERM_ORDER = [
  'camera.view','camera.playback','camera.export','camera.ptz','camera.config',
  'event.ack','user.manage','system.config','audit.view'
];

function permMeta(code) {
  return PERM_INFO[code] || { nome: code, grupo: 'Outros', faz: code, naoFaz: '' };
}

function chipsPerms(codes) {
  if (!codes || !codes.length) return '<span class="muted">nenhuma</span>';
  return codes.map(p => {
    const m = permMeta(p);
    return `<span class="badge" title="${esc(m.faz)}" style="display:inline-block;margin:2px 4px 2px 0;padding:3px 8px;border-radius:999px;background:#21262d;border:1px solid #30363d;font-size:11.5px">
      <b>${esc(m.nome)}</b> <span class="muted">(${esc(p)})</span></span>`;
  }).join('');
}

function listaPermsDetalhe(codes) {
  const set = new Set(codes || []);
  return PERM_ORDER.filter(p => set.has(p)).map(p => {
    const m = permMeta(p);
    return `<div style="padding:8px 0;border-bottom:1px solid #21262d">
      <div><b>${esc(m.nome)}</b> <code style="font-size:11px">${esc(p)}</code>
        <span class="muted" style="font-size:11px"> · ${esc(m.grupo)}</span></div>
      <div style="font-size:12.5px;margin-top:2px">${esc(m.faz)}</div>
      ${m.naoFaz ? `<div class="muted" style="font-size:11.5px;margin-top:2px">Não inclui: ${esc(m.naoFaz)}</div>` : ''}
    </div>`;
  }).join('') || '<span class="muted">Nenhuma permissão neste perfil.</span>';
}

            ? `<button class="ghost" onclick="duplicarPerfil(${r.id})">Duplicar para editar</button>`

function janelaPerfil(r) {
  const perms = (window.__perms ?? PERM_ORDER).slice().sort(
    (a, b) => PERM_ORDER.indexOf(a) - PERM_ORDER.indexOf(b));
  const tem = p => r?.permissoes?.includes(p);
  const grupos = [...new Set(perms.map(p => permMeta(p).grupo))];

  janela({
    titulo: r ? `Editar perfil — ${r.name}` : 'Novo perfil',
    largura: '720px',
    corpo: `
      <input type="hidden" id="pfId" value="${r?.id ?? ''}">
      <div class="grid2">
        <label class="f">Nome<input id="pfNome" value="${esc(r?.name ?? '')}" placeholder="Ex.: Operador noturno"></label>
        <label class="f">Descrição<input id="pfDesc" value="${esc(r?.description ?? '')}"
          placeholder="Resumo em uma linha do que este perfil faz"></label>
      </div>
      <p style="margin:14px 0 8px"><b>Marque o que este perfil pode fazer</b>
        <span class="muted">— desmarque o que não deve liberar</span></p>
      ${grupos.map(g => `
        <div style="margin-bottom:12px">
          <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${esc(g)}</div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${perms.filter(p => permMeta(p).grupo === g).map(p => {
              const m = permMeta(p);
              return `<label style="display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;padding:8px 10px;border:1px solid #2a3344;border-radius:8px;background:#0e1116;cursor:pointer">
                <input type="checkbox" class="pfP" value="${p}" ${tem(p) ? 'checked' : ''} style="margin-top:3px">
                <span>
                  <b>${esc(m.nome)}</b> <code style="font-size:11px">${esc(p)}</code>
                  <div style="font-size:12.5px;margin-top:3px;color:#c9d1d9">${esc(m.faz)}</div>
                  <div class="muted" style="font-size:11.5px;margin-top:2px">Não inclui: ${esc(m.naoFaz)}</div>
                </span>
              </label>`;
            }).join('')}
          </div>
        </div>`).join('')}
      <div class="err" id="pfjErr"></div>`,
    rodape: `<button class="ghost" onclick="fecharJanela()">Cancelar</button>
             <button onclick="salvarPerfil()">${r ? 'Salvar' : 'Criar perfil'}</button>`
  });
}

async function salvarPerfil() {
  const nome = $('pfNome').value.trim();
  if (!nome) { $('pfjErr').textContent = 'Informe o nome do perfil.'; return; }

  const corpo = JSON.stringify({
    name: nome, description: $('pfDesc').value,
    permissions: [...document.querySelectorAll('.pfP:checked')].map(i => i.value) });

  try {
    const id = $('pfId').value;
    await api(id ? `/api/roles/${id}` : '/api/roles',
      { method: id ? 'PUT' : 'POST', body: corpo });
    fecharJanela(); abrir('perfis');
  } catch (e) { $('pfjErr').textContent = e.message; }
}

async function duplicarPerfil(id) {
  await api(`/api/roles/${id}/duplicate`, { method:'POST' });
  abrir('perfis');
}
async function excluirPerfil(id) {
  if (!confirm('Excluir este perfil?')) return;
  try { await api(`/api/roles/${id}`, { method:'DELETE' }); abrir('perfis'); }
  catch (e) { $('pfErr').textContent = e.message; }
}

let flash = '';

VIEWS.direitos = async () => {
  const [perms, rights, us, gs, cams, cgs] = await Promise.all([
    api('/api/rights/permissions'), api('/api/rights'), api('/api/users'),
    api('/api/groups'), api('/api/vms/cameras'), api('/api/admin/camera-groups')]);

  const sujeito = r => r.subjectType === 'User'
    ? (us.find(u => u.id === r.subjectId)?.username ?? `usuário ${r.subjectId}`)
    : (gs.find(g => g.id === r.subjectId)?.name ?? `grupo ${r.subjectId}`);

  const alvo = r => {
    if (r.objectId === null)
      return `<span class="muted">todas as ${r.objectType === 'cameragroup' ? 'árvores' : 'câmeras'}</span>`;
    return r.objectType === 'cameragroup'
      ? `grupo “${esc(cgs.find(g => g.id === r.objectId)?.name ?? '#' + r.objectId)}”`
      : esc(cams.find(c => c.id === r.objectId)?.name ?? `#${r.objectId}`);
  };

  $('view').innerHTML = `
    <div class="panel" style="background:#141b26">
      <p style="margin:0"><b>Esta tela é para ajustes finos.</b> Para o dia a dia use
        <b>Grupos e acesso</b> — lá o perfil, o alcance e os membros são definidos juntos,
        com prévia antes de salvar.</p>
    </div>

    <div class="panel"><h3>Conceder ou negar direito</h3>
      ${flash ? `<div class="ok" style="margin-bottom:10px">${esc(flash)}</div>` : ''}
      <div class="inline">
        <label class="f">Sujeito<select id="dTipo">
          <option value="Group">Grupo</option><option value="User">Usuário</option></select></label>
        <label class="f">Quem<select id="dQuem"></select></label>
        <label class="f">Permissão<select id="dPerm">
          <option value="*">★ as do perfil do grupo</option>
          ${perms.map(p => `<option value="${p}">${p}</option>`).join('')}</select></label>
        <label class="f">Alvo<select id="dTipoObj">
          <option value="camera">Câmera</option>
          <option value="cameragroup">Grupo de câmeras</option></select></label>
        <label class="f">Qual<select id="dObj"></select></label>
        <label class="f">Efeito<select id="dEfe">
          <option value="Allow">Allow</option><option value="Deny">Deny</option></select></label>
        <button onclick="aplicarDireito()">Aplicar</button>
      </div>
      <div class="err" id="dErr"></div>
      <p class="hint"><b>Deny sempre vence Allow</b> — conceda amplo ao grupo e negue pontualmente.
        Direito sobre grupo de câmeras alcança os subgrupos e as câmeras que entrarem depois.
        A permissão <code>*</code> segue o perfil do grupo: trocar o perfil muda o acesso sem
        mexer aqui.</p>
    </div>

    <div class="panel"><h3>Direitos aplicados — ${rights.length}</h3>
      <table><thead><tr><th>Sujeito</th><th>Tipo</th><th>Permissão</th>
        <th>Alvo</th><th>Efeito</th><th></th></tr></thead>
      <tbody>${rights.map(r => `<tr>
        <td><b>${esc(sujeito(r))}</b></td><td class="muted">${r.subjectType}</td>
        <td>${r.permission === '*'
              ? '<span class="ok">★ perfil do grupo</span>'
              : `<code>${esc(r.permission)}</code>`}</td>
        <td>${alvo(r)}</td>
        <td class="${r.effect === 'Deny' ? 'off' : 'ok'}"><b>${r.effect}</b></td>
        <td style="text-align:right"><button class="danger" onclick="delDireito(${r.id})">Revogar</button></td>
      </tr>`).join('') || '<tr><td colspan="6" class="muted">Nenhum direito explícito.</td></tr>'}
      </tbody></table></div>

    <div class="panel"><h3>Direitos efetivos — por que este usuário vê o que vê</h3>
      <div class="inline">
        <label class="f">Usuário<select id="efUsr">${us.map(u =>
          `<option value="${u.id}">${esc(u.username)}</option>`).join('')}</select></label>
        <button class="ghost" onclick="verEfetivos()">Consultar</button>
      </div><div id="efOut" style="margin-top:12px"></div></div>`;

  flash = '';
  window.__cams = cams;

  const opcoes = tipo => (tipo === 'User' ? us.map(u => [u.id, u.username]) : gs.map(g => [g.id, g.name]))
    .map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');

  const preencher = () => $('dQuem').innerHTML = opcoes($('dTipo').value);
  $('dTipo').onchange = preencher; preencher();

  // A lista de alvos muda conforme o tipo: câmeras ou grupos de câmeras.
  const preencherAlvo = () => {
    const lista = $('dTipoObj').value === 'cameragroup' ? cgs : cams;
    $('dObj').innerHTML = '<option value="">Todos</option>' +
      lista.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join('');
  };
  $('dTipoObj').onchange = preencherAlvo; preencherAlvo();
};

async function aplicarDireito() {
  try {
    await api('/api/rights', { method:'POST', body: JSON.stringify({
      subjectType: $('dTipo').value, subjectId: +$('dQuem').value,
      objectType: $('dTipoObj').value,
      objectId: $('dObj').value === '' ? null : +$('dObj').value,
      permission: $('dPerm').value, effect: $('dEfe').value }) });
    flash = 'Direito aplicado.';
    abrir('direitos');
  } catch (e) { $('dErr').textContent = e.message; }
}

     'ldapPort','ldapTimeoutSeconds'].forEach(k => f[k] = +f[k]);

      $('secErr').innerHTML = '<span class="ok">✓ Security/LDAP salvos (reload ~200ms).</span>';
    } catch (err) { $('secErr').textContent = err.message; }
  };

  $('fSet').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    ['defaultRetentionDays','segmentSeconds','diskWarningPercent','diskCriticalPercent',
     'smtpPort','systemLogRetentionDays','eventLogRetentionDays','auditRetentionDays']
      .forEach(k => f[k] = +f[k]);
    ['encryptRecordings','watermarkExport','blurFacesOnExport','smtpUseTls'].forEach(k => f[k] = f[k] === 'true');
    f.mediaServerApi = s.mediaServerApi; f.mediaPublicHost = s.mediaPublicHost; f.id = s.id;

    try {
      await api('/api/admin/settings', { method:'PUT', body: JSON.stringify(f) });
      $('setErr').innerHTML = '<span class="ok">✓ Configurações salvas.</span>';
    } catch (err) { $('setErr').textContent = err.message; }
  };
};

function ioSyncCommboxPort() {
  const proto = $('cbProto')?.value || 'tcp';
  const port = $('cbPort');
  if (!port) return;
  if (proto === 'http') { if (+port.value === 1024 || !port.value) port.value = 80; }
  else if (proto === 'tcp') { if (+port.value === 80 || !port.value) port.value = 1024; }
}

async function cadastrarCommbox() {
  $('cbErr').textContent = '';
  try {
    await api('/api/admin/io-devices', {
      method: 'POST',
      body: JSON.stringify({
        name: $('cbNome').value,
        host: $('cbHost').value,
        port: +$('cbPort').value || 1024,
        username: $('cbUser').value,
        password: $('cbPass').value,
        driver: 'commbox',
        model: $('cbModel').value,
        protocol: $('cbProto').value
      })
    });
    abrir('iodev');
  } catch (e) { $('cbErr').textContent = e.message; }
}

async function cadastrarIo() {
  $('ioErr').textContent = '';
  try {
    await api('/api/admin/io-devices', {
      method: 'POST',
      body: JSON.stringify({
        name: $('ioNome').value,
        host: $('ioHost').value,
        port: +$('ioPort').value || 80,
        streamUrl: $('ioPath').value,
        username: $('ioUser').value,
        password: $('ioPass').value,
        driver: 'http-io'
      })
    });
    abrir('iodev');
  } catch (e) { $('ioErr').textContent = e.message; }
}

function ioChannel() {
  const el = $('cbCh');
  return el && +el.value > 0 ? +el.value : 1;
}

async function ioRelay(id, state) {
  const ch = ioChannel();
  try {
    const q = state === 'pulse'
      ? `channel=${ch}&ms=1000`
      : `channel=${ch}`;
    const r = await api(`/api/admin/io-devices/${id}/relay/${state}?${q}`, { method: 'POST' });
    $('ioLog').innerHTML = `<span class="ok">Relé ${state.toUpperCase()} ch=${ch} OK</span>
      <code style="margin-left:8px">${esc(JSON.stringify(r.data || r))}</code>`;
  } catch (e) {
    $('ioLog').innerHTML = `<span class="erro">${esc(e.message)}</span>`;
  }
}

async function ioTest(id) {
  try {
    const r = await api(`/api/admin/io-devices/${id}/test`, { method: 'POST' });

                          : d.name === 'onvif' ? 'ONVIF / RTSP (genérico)' : '—'}</td>
      </tr>`).join('')}</tbody></table>
      <p class="hint">Para suportar outro fabricante, implemente <code>IDeviceDriver</code>
        e registre uma linha em <code>Program.cs</code>.</p></div>`;
};

if (token) iniciar().catch(sair);
</script>
</body>
</html>
